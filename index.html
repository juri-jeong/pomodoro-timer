<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro with Coffee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
<div class="logo-box">      
<img class="pixel-logo" src="Juri_Cup.png" alt="Juri Cup">
</div>
<h2>Pomodoro<br>with<br>Coffee</h2>
      <p>Focus. One task at a time.</p>

      <nav>
        <button class="active">🏠 Today</button>
        <button>📋 Tasks</button>
        <button>📊 Stats</button>
        <button>⚙ Settings</button>
      </nav>

      
    </aside>

    <main class="content">
      <section class="task-input-panel">
        <h3>📋 Add New Task</h3>
        <div class="input-row">
          <input id="taskName" type="text" placeholder="Task name..." />
          <input id="taskMinutes" type="number" value="25" min="1" />
          <input id="breakMinutes" type="number" value="5" min="1" />
          <input id="taskSessions" type="number" value="4" min="1" />
          <button id="addTaskButton">+ Add Task</button>
        </div>
      </section>

      <section class="task-panel">
        <h3>Today's Tasks</h3>
        <div id="taskList" class="task-list"></div>
      </section>

      <section class="summary-panel">
        <div>
          <span>Total Focus Time</span>
          <strong id="totalFocusTime">0h 00m</strong>
        </div>
        <div>
          <span>Completed Sessions</span>
          <strong id="completedSessions">0</strong>
        </div>
      </section>
    </main>

    <section class="timer-panel">
      <div class="timer-mode">
        <button id="workModeButton" class="active">☕ Work</button>
        <button id="breakModeButton">🌙 Break</button>
      </div>

<div class="coffee-scene">
  <img class="cafe-scene-img" src="cafe-scene.png" alt="Cozy cafe workspace">
</div>



      <div id="timerDisplay" class="timer-display">25:00</div>

      <div class="timer-buttons">
        <button id="startButton">▶ Start</button>
        <button id="pauseButton">Ⅱ Pause</button>
        <button id="resetButton">↻ Reset</button>
      </div>

      <div class="goal-panel">
        <span>Session Goal</span>
        <strong id="sessionGoal">0 / 4 sessions</strong>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
